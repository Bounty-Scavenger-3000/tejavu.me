<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tejas MP</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    #intro {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      padding: 2rem 3rem;
      transition: opacity 0.8s cubic-bezier(.65,0,.35,1), filter 0.8s cubic-bezier(.65,0,.35,1);
    }
    #intro.fade-out { opacity: 0; filter: blur(6px); pointer-events: none; }

    .intro-inner { max-width: 700px; width: 100%; }
    .intro-inner.shake { animation: shake 0.4s ease; }

    .intro-line {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(1rem, 2.3vw, 1.35rem);
      color: var(--muted);
      font-weight: 300;
      line-height: 1.5;
      margin-bottom: 0.7rem;
    }

    .intro-line.big {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.7rem, 4.2vw, 2.7rem);
      color: var(--text);
      line-height: 1.3;
      margin: 0.3rem 0 0.9rem;
    }

    .intro-line.punch {
      font-family: 'DM Serif Display', serif;
      font-style: italic;
      font-size: clamp(2.1rem, 5.5vw, 3.4rem);
      color: var(--accent);
      margin: 0.5rem 0 1rem;
    }

    .w {
      display: inline-block;
      opacity: 0;
      filter: blur(7px);
      transform: translateY(16px) scale(0.94);
      transition: opacity 0.65s cubic-bezier(.16,1,.3,1),
                  filter 0.65s cubic-bezier(.16,1,.3,1),
                  transform 0.65s cubic-bezier(.16,1,.3,1);
    }
    .w.visible { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
    .w.em { color: var(--yellow); }

    /* ── mascot ── */
    #mascot-block {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      height: 58px;
      margin: 0.5rem 0 1rem;
    }

    #mascotCanvas {
      width: 44px; height: 44px;
      image-rendering: pixelated;
      flex-shrink: 0;
      opacity: 0;
      transform: translateY(30px) scale(0.5);
    }

    #mascotCanvas.hop-in {
      animation: hopIn 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    #mascotCanvas.idle { animation: idleBounce 0.7s ease-in-out infinite; }
    #mascotCanvas.crushed {
      animation: crushed 0.5s cubic-bezier(.55,0,.85,.35) forwards;
    }

    .mascot-speech {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--yellow);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.45rem 0.9rem;
      border-radius: 3px;
      opacity: 0;
      transform: scale(0.85) translateX(-8px);
      transition: opacity 0.4s cubic-bezier(.34,1.56,.64,1), transform 0.4s cubic-bezier(.34,1.56,.64,1);
    }
    .mascot-speech.visible { opacity: 1; transform: scale(1) translateX(0); }

    @keyframes hopIn {
      0% { transform: translateY(30px) scale(0.5); opacity: 0; }
      55% { transform: translateY(-10px) scale(1.08); opacity: 1; }
      75% { transform: translateY(4px) scale(0.97); }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes idleBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.02); }
    }
    @keyframes crushed {
      0% { transform: scale(1) rotate(0); opacity: 1; }
      35% { transform: scaleY(0.25) scaleX(1.35) translateY(10px) rotate(-5deg); opacity: 1; }
      100% { transform: scaleY(0.05) scaleX(1.5) translateY(16px) rotate(3deg); opacity: 0; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    /* ── choice screen ── */
    #choice {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem 3rem;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #choice.visible { opacity: 1; }

    .choice-label {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3rem;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .choice-label.visible { opacity: 1; }

    .pills {
      display: flex;
      gap: 2.5rem;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.2rem;
    }

    .pill {
      display: flex; flex-direction: column;
      align-items: center; gap: 1.1rem;
      cursor: pointer; text-decoration: none;
      opacity: 0;
    }
    .pill.drop {
      animation: pillDrop 0.85s cubic-bezier(.34,1.56,.64,1) forwards;
    }

    .pill-capsule {
      width: 54px; height: 128px;
      border-radius: 999px;
      position: relative;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }
    .pill:hover .pill-capsule { transform: translateY(-6px) rotate(-3deg); }

    .pill--blue .pill-capsule {
      background: linear-gradient(180deg, #6aa3d8 0%, #2a4f70 100%);
      box-shadow: 0 0 0 rgba(90,143,192,0);
    }
    .pill--red .pill-capsule {
      background: linear-gradient(180deg, #d86a6a 0%, #702a2a 100%);
      box-shadow: 0 0 0 rgba(192,90,90,0);
    }
    .pill:hover.pill--blue .pill-capsule { box-shadow: 0 0 36px rgba(106,163,216,0.35); }
    .pill:hover.pill--red .pill-capsule { box-shadow: 0 0 36px rgba(216,106,106,0.35); }

    .pill-capsule::after {
      content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px;
      background: rgba(255,255,255,0.18);
    }

    .pill-label {
      font-size: 0.8rem; color: var(--muted);
      text-align: center; max-width: 150px; line-height: 1.4;
      transition: color 0.2s;
    }
    .pill:hover .pill-label { color: var(--text); }

    @keyframes pillDrop {
      0% { transform: translateY(-180px) rotate(-25deg); opacity: 0; }
      55% { transform: translateY(14px) rotate(6deg); opacity: 1; }
      75% { transform: translateY(-6px) rotate(-3deg); }
      100% { transform: translateY(0) rotate(0deg); opacity: 1; }
    }

    .middle-btn {
      font-size: 0.72rem; color: var(--muted);
      letter-spacing: 0.04em; border: none; background: none;
      cursor: pointer; padding: 0.4rem 0;
      border-bottom: 1px solid var(--border);
      transition: color 0.2s, border-color 0.2s;
      text-decoration: none; display: inline-block;
      opacity: 0; transform: translateY(8px);
    }
    .middle-btn.visible {
      animation: fadeUp 0.6s ease forwards;
    }
    .middle-btn:hover { color: var(--text); border-color: var(--muted); }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      #intro, #choice { padding: 2rem 1.5rem; }
      .pills { gap: 1.6rem; }
      .pill-capsule { width: 42px; height: 100px; }
    }
  </style>
</head>
<body>

  <div id="intro">
    <div class="intro-inner" id="introInner"></div>
  </div>

  <div id="choice">
    <p class="choice-label" id="choiceLabel">— what brought you here?</p>
    <div class="pills">
      <a class="pill pill--blue" id="pillBlue" href="about.html">
        <div class="pill-capsule"></div>
        <span class="pill-label">do you wanna worship me?</span>
      </a>
      <a class="pill pill--red" id="pillRed" href="work.html">
        <div class="pill-capsule"></div>
        <span class="pill-label">do you wanna give me a job at Deloitte (plz)</span>
      </a>
    </div>
    <a class="middle-btn" id="middleBtn" href="everything.html">
      if you're not able to decide, confuse yourself on the homescreen
    </a>
  </div>

  <script>
    /* ============================================
       LINE DATA
       ============================================ */
    const lines = [
      { text: "You've met people my age doing a lot of different things.", size: '' },
      { text: "I finished a professional degree while working full-time. At 19.", size: 'big', em: ['At','19.'] },
      { text: "Not the interesting part.", size: '' },
      { text: "Same time — moderating 20,000 volunteers across 4 cities.", size: '' },
      { text: "Same time — walking off a stage where 300+ people laughed after every line I dropped.", size: '' },
      { text: "Both. At once.", size: 'punch' },
    ];

    const introInner = document.getElementById('introInner');
    let cursor = 250; // ms cursor

    function buildLine(line) {
      const p = document.createElement('p');
      p.className = 'intro-line' + (line.size ? ' ' + line.size : '');
      const words = line.text.split(' ');
      words.forEach((word, i) => {
        const span = document.createElement('span');
        span.className = 'w' + (line.em && line.em.includes(word) ? ' em' : '');
        span.textContent = word;
        p.appendChild(span);
        if (i < words.length - 1) p.appendChild(document.createTextNode(' '));
      });
      introInner.appendChild(p);
      return p.querySelectorAll('.w');
    }

    lines.forEach((line) => {
      const wordEls = buildLine(line);
      const wordGap = line.size === 'punch' ? 90 : line.size === 'big' ? 65 : 45;
      wordEls.forEach((w, i) => {
        w.style.transitionDelay = (cursor + i * wordGap) + 'ms';
      });
      requestAnimationFrame(() => requestAnimationFrame(() => {
        wordEls.forEach(w => w.classList.add('visible'));
      }));
      const lineDuration = wordEls.length * wordGap + 650;
      const pauseAfter = line.size === 'punch' ? 750 : line.size === 'big' ? 550 : 400;
      cursor += lineDuration - 500 + pauseAfter; // overlap tail of transition with next line start
    });

    /* ============================================
       MASCOT
       ============================================ */
    const P='#a568d9', E='#f4f1ea', K='#1a1a1a', D='#1a1a1a', N=null;
    const mascotIdle = [
      [N,N,P,P,P,P,N,N],
      [N,P,P,P,P,P,P,N],
      [P,P,E,P,P,E,P,P],
      [P,P,K,P,P,K,P,P],
      [P,P,P,P,P,P,P,P],
      [N,P,D,D,D,D,P,N],
      [N,N,P,P,P,P,N,N],
      [N,N,P,N,N,P,N,N],
    ];
    const mascotTalk = [
      [N,N,P,P,P,P,N,N],
      [N,P,P,P,P,P,P,N],
      [P,P,E,P,P,E,P,P],
      [P,P,K,P,P,K,P,P],
      [P,P,P,P,P,P,P,P],
      [N,P,D,N,N,D,P,N],
      [N,P,D,D,D,D,P,N],
      [N,N,P,N,N,P,N,N],
    ];

    const mascotCanvas = document.createElement('canvas');
    mascotCanvas.id = 'mascotCanvas';
    mascotCanvas.width = 8; mascotCanvas.height = 8;

    function drawMascot(grid) {
      const ctx = mascotCanvas.getContext('2d');
      ctx.clearRect(0, 0, 8, 8);
      grid.forEach((row, y) => row.forEach((c, x) => {
        if (c) { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); }
      }));
    }
    drawMascot(mascotIdle);

    /* schedule mascot entrance after "Both. At once." finishes */
    const mascotEntry = cursor + 400;

    setTimeout(() => {
      const block = document.createElement('div');
      block.id = 'mascot-block';
      const speech = document.createElement('span');
      speech.className = 'mascot-speech';
      speech.textContent = '"bro is definitely larpmaxing"';
      block.appendChild(mascotCanvas);
      block.appendChild(speech);
      introInner.appendChild(block);

      mascotCanvas.classList.add('hop-in');
      setTimeout(() => {
        mascotCanvas.classList.remove('hop-in');
        mascotCanvas.classList.add('idle');
        drawMascot(mascotTalk);
        speech.classList.add('visible');
      }, 600);
    }, mascotEntry);

    /* crush the mascot */
    const mascotCrush = mascotEntry + 600 + 2100;
    setTimeout(() => {
      const introInnerEl = document.getElementById('introInner');
      mascotCanvas.classList.remove('idle');
      mascotCanvas.classList.add('crushed');
      document.querySelector('.mascot-speech').style.opacity = '0';
      introInnerEl.classList.add('shake');
      setTimeout(() => introInnerEl.classList.remove('shake'), 400);
    }, mascotCrush);

    /* closing lines */
    const closingLines = [
      { text: "He's programmed to say that. Maybe you're not.", size: '' },
      { text: "Choose what interests you.", size: '' },
    ];
    const closingStart = mascotCrush + 500;

    closingLines.forEach((line, idx) => {
      const startAt = closingStart + idx * 700;
      setTimeout(() => {
        const wordEls = buildLine(line);
        wordEls.forEach((w, i) => { w.style.transitionDelay = (i * 45) + 'ms'; });
        requestAnimationFrame(() => requestAnimationFrame(() => {
          wordEls.forEach(w => w.classList.add('visible'));
        }));
      }, startAt);
    });

    /* fade intro, reveal choice */
    const introEnd = closingStart + closingLines.length * 700 + 900;
    setTimeout(() => {
      document.getElementById('intro').classList.add('fade-out');
      setTimeout(() => {
        document.getElementById('intro').style.display = 'none';
        const choice = document.getElementById('choice');
        choice.classList.add('visible');
        document.getElementById('choiceLabel').classList.add('visible');

        setTimeout(() => document.getElementById('pillBlue').classList.add('drop'), 200);
        setTimeout(() => document.getElementById('pillRed').classList.add('drop'), 380);
        setTimeout(() => document.getElementById('middleBtn').classList.add('visible'), 1250);
      }, 800);
    }, introEnd);
  </script>

</body>
</html>

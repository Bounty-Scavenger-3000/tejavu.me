name: Build and deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Superseded dev builds are cancelled. A deploy from main is never cancelled mid-way.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Redraw the code graph from the current source, so every deploy shows the code as it is.
      # If graphify or the snapshot fails, the committed snapshot stays and the build goes on.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh the code graph
        run: |
          if pip install --quiet graphifyy==0.9.97 \
             && graphify extract . --code-only \
             && npm run graph \
             && node -e "const d=require('./src/graph/graph-data.json'); const f=d.nodes.filter(n=>n.k==='file').length; console.log('graph:', f, 'files,', d.nodes.length - f, 'symbols,', d.links.length, 'links'); process.exit(f < 15 ? 1 : 0)"; then
            echo "Code graph refreshed."
          else
            echo "::warning::Code graph refresh failed, so the build uses the committed snapshot."
            git checkout -- src/graph/graph-data.json
          fi
      - run: npm run build
      # Only main publishes. A push to dev runs the build as a check and stops here.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

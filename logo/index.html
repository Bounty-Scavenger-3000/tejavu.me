<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tejavu — Logo Export</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preload" href="/src/core/fonts/universa.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/src/core/fonts/moonrock.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/src/core/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/src/logo/logo.css">
</head>
<body>

<div class="page-label">TEJAVU — LOGO EXPORT</div>

<div class="modes" role="group" aria-label="Content mode">
  <button class="mode-btn" data-mode="tejavu" title="Personal · IRL">Tejavu</button>
  <button class="mode-btn" data-mode="signal" title="Finance · Tech">Signal</button>
  <button class="mode-btn" data-mode="noise" title="Opinions · Shitposting">Noise</button>
</div>

<!-- Primary: Dark (full width) -->
<div class="card-primary-wrap">
  <div class="glow">
    <div class="card" id="v1" style="width:100%;min-height:220px;"></div>
  </div>
  <div class="card-footer">
    <div class="card-label">Dark (primary)</div>
    <button class="export-btn" data-export="v1">Export PNG</button>
  </div>
</div>

<!-- Grid: Surface, White, Accent (pink) -->
<div class="grid">
  <div>
    <div class="glow"><div class="card" id="v2"></div></div>
    <div class="card-footer">
      <div class="card-label">Surface</div>
      <button class="export-btn" data-export="v2">Export PNG</button>
    </div>
  </div>
  <div>
    <div class="glow"><div class="card" id="v3"></div></div>
    <div class="card-footer">
      <div class="card-label">White</div>
      <button class="export-btn" data-export="v3">Export PNG</button>
    </div>
  </div>
  <div>
    <div class="glow glow-mode"><div class="card" id="v4"></div></div>
    <div class="card-footer">
      <div class="card-label">Accent (pink)</div>
      <button class="export-btn" data-export="v4">Export PNG</button>
    </div>
  </div>
</div>

<!-- Grid: mode-colour backgrounds. The mode switch does not change these. -->
<div class="grid">
  <div>
    <div class="glow"><div class="card" id="v5"></div></div>
    <div class="card-footer">
      <div class="card-label">Accent (teal)</div>
      <button class="export-btn" data-export="v5">Export PNG</button>
    </div>
  </div>
  <div>
    <div class="glow"><div class="card" id="v6"></div></div>
    <div class="card-footer">
      <div class="card-label">Accent (green)</div>
      <button class="export-btn" data-export="v6">Export PNG</button>
    </div>
  </div>
  <div>
    <div class="glow"><div class="card" id="v7"></div></div>
    <div class="card-footer">
      <div class="card-label">Accent (amber)</div>
      <button class="export-btn" data-export="v7">Export PNG</button>
    </div>
  </div>
</div>

<button class="export-all" data-export-all>Export all 7 variations</button>
<div class="status" id="status"></div>

<script type="module" src="/src/logo/logo.js"></script>
</body>
</html>

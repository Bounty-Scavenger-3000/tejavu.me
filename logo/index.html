<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tejavu — Logo Export</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preload" href="/src/core/fonts/universa.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="/src/logo/logo.css">
</head>
<body>

<div class="page-label">TEJAVU — LOGO EXPORT</div>

<!-- Primary: Dark (full width) -->
<div class="card-primary-wrap">
  <div class="glow-pink">
    <div class="card" id="v1" style="background:#0D0B0E;width:100%;min-height:220px;"></div>
  </div>
  <div class="card-primary-footer">
    <div class="card-label">Dark (primary)</div>
    <button class="export-btn" style="background:#0D0B0E;color:#FFFFFF;" data-export="v1:tejavu-logo-dark">Export PNG</button>
  </div>
</div>

<!-- Grid: Surface, White, Accent (pink), Teal -->
<div class="grid">
  <div>
    <div class="glow-pink"><div class="card" id="v2" style="background:#141418"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 2px">
      <div class="card-label">Surface</div>
      <button class="export-btn" style="background:#141418;color:#FFFFFF;" data-export="v2:tejavu-logo-surface">Export PNG</button>
    </div>
  </div>
  <div>
    <div class="glow-pink"><div class="card" id="v3" style="background:#FFFFFF"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 2px">
      <div class="card-label">White</div>
      <button class="export-btn" style="background:#FFFFFF;color:#0D0B0E;" data-export="v3:tejavu-logo-light">Export PNG</button>
    </div>
  </div>
  <div>
    <div class="glow-teal"><div class="card" id="v4" style="background:#FF7A8F"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 2px">
      <div class="card-label">Accent (pink)</div>
      <button class="export-btn" style="background:#FF7A8F;color:#0D0B0E;" data-export="v4:tejavu-logo-accent">Export PNG</button>
    </div>
  </div>
  <div>
    <div class="glow-pink"><div class="card" id="v5" style="background:#49D7E8"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 2px">
      <div class="card-label">Support (teal)</div>
      <button class="export-btn" style="background:#49D7E8;color:#0D0B0E;border-color:#FF7A8F;box-shadow:0 0 8px rgba(255,122,143,0.45);" data-export="v5:tejavu-logo-teal">Export PNG</button>
    </div>
  </div>
</div>

<button class="export-all" data-export-all>Export all 5 variations</button>
<div class="status" id="status"></div>

<script type="module" src="/src/logo/logo.js"></script>
</body>
</html>

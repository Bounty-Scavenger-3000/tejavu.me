* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0D0B0E;
  color: #FFFFFF;
  font-family: 'Inter', sans-serif;
  padding: 24px;
}

.page-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  opacity: .3;
  margin-bottom: 20px;
}

/* ── Primary dark card — full width, taller ── */
.card-primary-wrap {
  margin-bottom: 14px;
}

.card-primary {
  border-radius: 14px;
  padding: 60px 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  width: 100%;
  background: #0D0B0E;
  border: 1px solid rgba(217,222,229,0.07);
}

.card-primary-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  padding: 0 2px;
}

/* ── 2-col grid for the other 4 ── */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 20px;
}

.card {
  border-radius: 14px;
  padding: 40px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  min-height: 180px;
}

.card-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  opacity: .35;
  margin-top: 4px;
}

.export-btn {
  padding: 7px 16px;
  border-radius: 100px;
  border: 1.5px solid #49D7E8;
  box-shadow: 0 0 8px rgba(73,215,232,0.45);
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
  white-space: nowrap;
}

.export-btn:hover { opacity: .75; }

.export-all {
  display: block;
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1.5px solid rgba(255,122,143,.3);
  background: transparent;
  color: #FF7A8F;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .02em;
}

.export-all:hover { background: rgba(255,122,143,.08); }

.status {
  font-size: 11px;
  opacity: .4;
  text-align: center;
  margin-top: 8px;
  min-height: 16px;
}

/* ── Card glow wrappers — display only, never captured by html2canvas ── */
.glow-pink {
  border-radius: 16px;
  box-shadow: 0 0 0 1.5px rgba(255,122,143,0.5), 0 0 18px 4px rgba(255,122,143,0.3);
}
.glow-teal {
  border-radius: 16px;
  box-shadow: 0 0 0 1.5px rgba(73,215,232,0.5), 0 0 18px 4px rgba(73,215,232,0.3);
}
.glow-dark {
  border-radius: 16px;
  box-shadow: 0 0 0 1.5px rgba(13,11,14,0.8), 0 0 18px 4px rgba(13,11,14,0.6);
}

/* ── Mobile ── */
@media (max-width: 540px) {
  body { padding: 16px; }

  .card-primary {
    padding: 44px 20px;
  }

  .grid {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .card {
    min-height: 160px;
    padding: 36px 20px;
  }
}
</style>

<script>

*/

    <line x1="3" y1="3" x2="77" y2="3" stroke="${top}" stroke-width="${sw}" stroke-linecap="round"/>
    <line x1="40" y1="3" x2="40" y2="48" stroke="${top}" stroke-width="${sw}" stroke-linecap="round"/>
    <line x1="40" y1="48" x2="5" y2="93" stroke="${leftLeg}" stroke-width="${sw}" stroke-linecap="round"/>
    <line x1="40" y1="48" x2="75" y2="93" stroke="${rightLeg}" stroke-width="${sw}" stroke-linecap="round"/>
  </svg>`;
}

function makeLockup(v) {
  const { textColor, topColor, divColor, leftLeg, rightLeg, gradient } = v;
  const underline = `<div style="display:block;width:100%;height:3px;border-radius:2px;background:${gradient};margin-top:5px"></div>`;
  return `
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:nowrap">
      ${makeMark(textColor, 64, leftLeg, rightLeg, topColor)}
      <div style="width:1.5px;height:44px;background:${divColor};flex-shrink:0"></div>
      <div style="display:flex;flex-direction:column;gap:0px">
        <span style="font-family:'Universa',sans-serif;font-size:26px;letter-spacing:.05em;color:${textColor};line-height:1">TEJAVU</span>
        ${underline}
        <div style="font-family:'Inter',sans-serif;font-size:9px;letter-spacing:.12em;color:${textColor};opacity:.75;margin-top:6px">THINK LESS. HAPPY MORE.</div>
      </div>
    </div>`;
}

variants.forEach(v => {
  const el = document.getElementById(v.id);
  if (el) el.innerHTML = makeLockup(v);
});

async function exportOne(id, filename) {
  setStatus('Rendering...');
  const el = document.getElementById(id);
  const canvas = await html2canvas(el, {
    scale: 4,
    backgroundColor: null,
    useCORS: true,
    logging: false,
  });
  const link = document.createElement('a');
  link.download = filename + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  setStatus(filename + '.png downloaded.');
}

async function exportAll() {
  const items = [
    ['v1', 'tejavu-logo-dark'],
    ['v2', 'tejavu-logo-surface'],
    ['v3', 'tejavu-logo-light'],
    ['v4', 'tejavu-logo-accent'],
    ['v5', 'tejavu-logo-teal'],
  ];
  for (let i = 0; i < items.length; i++) {
    setStatus(`Exporting ${i + 1} of ${items.length}...`);
    await exportOne(items[i][0], items[i][1]);
    await new Promise(r => setTimeout(r, 600));
  }
  setStatus('All 5 exported.');
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}
</script>
</body>
</html>
